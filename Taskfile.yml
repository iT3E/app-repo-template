---
version: "3"

# Tasks for working on the template. App repos get template/Taskfile.yml.jinja.

vars:
  OUT: '{{.ROOT_DIR}}/out'

tasks:
  default:
    cmds:
      - task --list

  precommit:init:
    desc: Install the git hooks (pre-commit and commit-msg) in this clone
    cmds:
      - bin/install-hooks

  precommit:run:
    desc: Run every hook on every file
    cmds:
      - pre-commit run --all-files

  privacy:check:
    desc: Check tracked files and paths against the privacy denylist
    cmds:
      - bin/privacy-check {{.CLI_ARGS}}

  privacy:sync:
    desc: Copy the denylist from a tnwks-ops checkout into this repo's PRIVACY_TERMS Actions secret
    vars:
      OPS: '{{.TNWKS_OPS_DIR | default "../tnwks-ops"}}'
    cmds:
      - (cd "{{.OPS}}" && sops -d --extract '["terms"]' .github/privacy-terms.sops.yaml) | gh secret set PRIVACY_TERMS

  changelog:new:
    desc: Add a Changie fragment for this PR (needs changie, brew install changie)
    cmds:
      - changie new

  render:
    desc: Render every answers set in tests/ from the last commit into out/<name>/ (commit first; copier reads git)
    cmds:
      - rm -rf "{{.OUT}}"
      - for: [go, python, node, go-lib, none]
        cmd: copier copy --quiet --defaults --data-file tests/{{.ITEM}}.yml --vcs-ref HEAD "{{.ROOT_DIR}}" "{{.OUT}}/example-{{.ITEM}}"
