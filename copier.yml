# Copier template for an app repo (https://copier.readthedocs.io).
#
#   copier copy --vcs-ref vX.Y.Z https://github.com/iT3E/app-repo-template.git <dir>
#   copier update --vcs-ref vX.Y.Z        # in a repo made from it
#
# Kept free of Copier's unsafe features (_tasks, _migrations,
# _jinja_extensions, _external_data): Renovate's hosted copier manager runs
# `copier update` without --trust and refuses them. template-ci.yaml fails
# if one appears.

_min_copier_version: "9.4.0"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja

# GitHub Actions uses ${{ }}, Taskfile and Changie use {{ }}, so Jinja gets
# [[ ]] for values, [% %] for blocks and [# #] for comments.
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true

# Created once, then owned by the repo: copier update never touches them.
_skip_if_exists:
  - README.md
  - CHANGELOG.md
  - .gitignore
  - .golangci.yml
  - .github/privacy-allow

_message_after_copy: |
  Next, in [[ _copier_conf.dst_path ]]:
    1. Set the PRIVACY_TERMS Actions secret: task privacy:sync
    2. Install the hooks: task precommit:init
    3. Run bin/privacy-check, then open everything as one PR.
  See https://github.com/iT3E/app-repo-template#create-a-new-app-repo

# The iT3E/github-workflows release every rendered caller (@<sha> # vX.Y.Z)
# and Renovate preset (#vX.Y.Z) uses, as "<tag>@<the tag's commit>". It is
# the one place that version lives: Renovate here bumps it (with this
# repo's own callers, in one PR), merging that releases the template, and
# app repos get it with copier update. App repos never bump it themselves,
# so the update never conflicts (README "How updates flow"). Not asked and
# not stored in .copier-answers.yml.
github_workflows:
  type: str
  # renovate: datasource=github-tags depName=iT3E/github-workflows
  default: "v1.8.1@4968e2ea41429e3b8e9b1e77f41d222a5ea01436"
  when: false

github_workflows_ref:
  type: str
  default: "[[ github_workflows.split('@')[0] ]]"
  when: false

github_workflows_sha:
  type: str
  default: "[[ github_workflows.split('@')[1] ]]"
  when: false

# Not asked and not stored: the destination directory's name (normally the
# repo name, also in Renovate's checkout). It only fills files created once
# (README.md, .gitignore), so .copier-answers.yml never names a repo.
repo_name:
  type: str
  default: "[[ _copier_conf.dst_path | realpath | basename ]]"
  when: false

# none: a docs-only repo (Markdown, no code). No build.yaml, no image and no
# language Renovate preset; privacy, secret scan, changelog, release, labels
# and actionlint are the same as in every other repo.
language:
  type: str
  help: "Language of the app (none: a docs-only repo, no build job)"
  choices:
    - go
    - python
    - node
    - none

has_image:
  type: bool
  help: "Does CI build a Dockerfile into a (public) GHCR image?"
  default: "[[ language != 'none' ]]"
  when: "[[ language != 'none' ]]"

image_name:
  type: str
  help: "Image name (empty: ghcr.io/<owner>/<repo>, from the repo CI runs in)"
  default: ""
  when: "[[ has_image ]]"

image_push_main:
  type: bool
  help: >-
    Push :main and :sha-<short> on every merge to main? No means only v*
    tags push (deploys pin :<version>@sha256), and the push gate checks the
    whole history instead of the tree.
  default: true
  when: "[[ has_image ]]"

go_version:
  type: str
  help: "Go version for CI (go.mod: read the go directive)"
  default: go.mod
  when: "[[ language == 'go' ]]"

python_version:
  type: str
  help: "Python version for CI's host-side checks"
  default: "3.12"
  when: "[[ language == 'python' ]]"

node_version:
  type: str
  help: "Node version for CI (.nvmrc: read the version file; anything else pins setup-node)"
  default: .nvmrc
  when: "[[ language == 'node' ]]"

node_lint:
  type: bool
  help: "Run the package's lint script (npm run lint) in CI?"
  default: true
  when: "[[ language == 'node' ]]"

node_format_check:
  type: bool
  help: "Run prettier --check in CI? Needs prettier as a devDependency."
  default: true
  when: "[[ language == 'node' ]]"

extra_test_command:
  type: str
  help: "Extra bash for CI after the language tests (empty: none)"
  default: ""
  multiline: true
  when: "[[ language != 'none' ]]"

image_test_command:
  type: str
  help: "Bash run against the built image before any push; $IMAGE_REF is its tag (empty: none)"
  default: ""
  multiline: true
  when: "[[ has_image ]]"

image_test_postgres:
  type: bool
  help: >-
    Start a throwaway Postgres for image_test_command? It listens on
    127.0.0.1:5432 in CI ($TEST_POSTGRES_URL; containers need --network
    host), and task test starts one on 127.0.0.1:55432.
  default: false
  when: "[[ has_image and image_test_command != '' ]]"
