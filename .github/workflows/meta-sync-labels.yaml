---
name: "Sync labels"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/labels.yaml"]

permissions: {}

jobs:
  labels:
    name: sync-labels
    permissions:
      contents: read
      issues: write
    uses: iT3E/github-workflows/.github/workflows/sync-labels.yaml@81dd48479541d3a5ef461a03d658b1f943b2f969 # v1.2.1
