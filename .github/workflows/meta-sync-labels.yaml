---
name: "Sync labels"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/labels.yaml"]

permissions: {}

jobs:
  labels:
    name: sync-labels
    permissions:
      contents: read
      issues: write
    uses: iT3E/github-workflows/.github/workflows/sync-labels.yaml@49f998b9ac2a57f441c9380cce88bfcd9abf7ffa # v1.9.3
