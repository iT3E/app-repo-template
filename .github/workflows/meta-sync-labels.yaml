---
name: "Sync labels"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/labels.yaml"]

permissions: {}

jobs:
  labels:
    name: sync-labels
    permissions:
      contents: read
      issues: write
    uses: iT3E/github-workflows/.github/workflows/sync-labels.yaml@4968e2ea41429e3b8e9b1e77f41d222a5ea01436 # v1.8.1
