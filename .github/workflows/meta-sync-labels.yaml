---
name: "Sync labels"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/labels.yaml"]

permissions: {}

jobs:
  labels:
    name: sync-labels
    permissions:
      contents: read
      issues: write
    uses: iT3E/github-workflows/.github/workflows/sync-labels.yaml@4628c925b741e980e4dfab955ec7e7db5dc14ef1 # v1.10.0
