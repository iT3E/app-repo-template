  pull_request:
  push:
    branches: ["main"]

permissions: {}

jobs:
  betterleaks:
    name: betterleaks
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/secret-scan.yaml@4628c925b741e980e4dfab955ec7e7db5dc14ef1 # v1.10.0
