---
name: "Secret Scan"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

jobs:
  betterleaks:
    name: betterleaks
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/secret-scan.yaml@adf6ecc525a6b011564e59bf6baeec1fa4d47fb7 # v1.0.2
