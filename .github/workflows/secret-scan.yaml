---
name: "Secret Scan"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

jobs:
  betterleaks:
    name: betterleaks
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/secret-scan.yaml@45f64446efd0d5cd93e12c13fb594a3ab32dd0d2 # v1.0.0
