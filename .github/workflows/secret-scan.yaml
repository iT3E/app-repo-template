---
name: "Secret Scan"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

jobs:
  betterleaks:
    name: betterleaks
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/secret-scan.yaml@7a7fbecebab0e5a161848c1b1920741f2f2b8a4e # v1.9.7
