---
name: "Release"

# Releasing the template: merge a PR with a Changie fragment, and this tags
# vX.Y.Z (README "Releasing the template"). The tag is what app repos'
# .copier-answers.yml moves to. No image, so nothing is dispatched.
#
# A push that moves the github_workflows pin in copier.yml (Renovate's
# github-workflows PR, which has no fragment) releases too: the pin job
# hands release.yaml a fragment naming the new version, so every
# github-workflows release becomes a template release and reaches app repos
# as their copier update PR.
#
# Any other Renovate merge that changed what app repos render (template/,
# say a hook rev or a pinned tool) releases a patch through auto-fragment
# ("Dependency updates"). One that only touches this repo's own CI, hooks or
# Taskfile releases nothing. So every push to main runs this.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto follows the fragment kinds)"
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pin:
    name: github-workflows pin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      kind: ${{ steps.pin.outputs.kind }}
      body: ${{ steps.pin.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Did this push move it?
        id: pin
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          pin() { sed -nE '/^github_workflows:/,/^[a-z]/s/^  default: "(v[^@"]+)@[0-9a-f]{40}"$/\1/p'; }
          new="$(pin < copier.yml)"
          old=""
          if [ "$EVENT" = "push" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            old="$(git show "${BEFORE}:copier.yml" | pin)"
          fi
          echo "github-workflows pin: '${old}' -> '${new}'"
          if [ -z "$old" ] || [ -z "$new" ] || [ "$old" = "$new" ]; then
            exit 0
          fi
          # A patch release of the workflows is a patch release here; a
          # minor or major one changes what app repos run, so minor.
          if [ "${old%.*}" = "${new%.*}" ]; then kind=Fixed; else kind=Changed; fi
          {
            echo "kind=$kind"
            echo "body=Rendered workflow callers and Renovate presets: iT3E/github-workflows ${old} to ${new} (https://github.com/iT3E/github-workflows/releases/tag/${new})."
          } >> "$GITHUB_OUTPUT"

  release:
    name: release
    needs: pin
    permissions:
      contents: write
      actions: write
    uses: iT3E/github-workflows/.github/workflows/release.yaml@317dd05ec8f5988a9a6f799a2119aba537b4bb16 # v1.4.2
    with:
      bump: ${{ inputs.bump || 'auto' }}
      build-workflow: ""
      fragment-kind: ${{ needs.pin.outputs.kind || 'Fixed' }}
      fragment-body: ${{ needs.pin.outputs.body }}
      auto-fragment: "Dependency updates"
      ship-paths: |
        template
        copier.yml
