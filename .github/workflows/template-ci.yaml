---
name: "Template CI"

# Tests the template itself on every PR and push to main. The reusable
# workflows and the Renovate presets live in iT3E/github-workflows (they
# have their own tests there); this checks the scaffolding that calls them.
#   lint      copier.yml uses no unsafe Copier feature; shellcheck on
#             template/bin/*; yamllint on this repo's YAML.
#   pins      copier.yml's github_workflows is "<tag>@<the tag's commit>",
#             and this repo's own callers and Renovate preset use that same
#             release (Renovate must move them together).
#   actionlint   this repo's workflows (github-workflows' actionlint.yaml).
#   render    copier copy for each answers set in tests/ (Go with an image,
#             Python with a tag-only image, Go without one), then on the
#             result: every caller pins github_workflows; actionlint with
#             the reusable workflows of that release swapped in as local
#             files (so every with:/secrets: is checked against their
#             inputs); pre-commit validate-config, yamllint, shellcheck.
#             Then copier update from the newest tag this commit descends
#             from must apply cleanly and match a fresh render.
#   renovate  renovate-config-validator on this repo's config and the
#             rendered repo configs, as repo configs.
on:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=pypi depName=copier
  COPIER_VERSION: "9.19.1"
  # renovate: datasource=pypi depName=pre-commit
  PRE_COMMIT_VERSION: "4.7.0"
  # renovate: datasource=pypi depName=yamllint
  YAMLLINT_VERSION: "1.38.0"
  # renovate: datasource=github-releases depName=rhysd/actionlint
  ACTIONLINT_VERSION: "v1.7.12"
  # renovate: datasource=npm depName=renovate
  RENOVATE_VERSION: "44.206.2"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Renovate's hosted copier manager runs copier update without --trust
      # and refuses templates that need it.
      - name: No unsafe Copier features
        run: |
          if grep -nE '^\s*_(tasks|migrations|jinja_extensions|external_data)\s*:' copier.yml; then
            echo "::error file=copier.yml::copier.yml uses an unsafe Copier feature (needs --trust; Renovate's copier manager refuses it)"
            exit 1
          fi

      - name: shellcheck
        run: shellcheck template/bin/*

      - name: yamllint
        run: |
          pipx run "yamllint==${YAMLLINT_VERSION}" -c .yamllint.yaml \
            .github copier.yml tests .yamllint.yaml .changie.yaml .pre-commit-config.yaml

  pins:
    name: pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: github_workflows is a tag and its commit
        run: |
          pin="$(sed -nE '/^github_workflows:/,/^[a-z]/s/^  default: "(v[0-9]+\.[0-9]+\.[0-9]+@[0-9a-f]{40})"$/\1/p' copier.yml)"
          if [ -z "$pin" ]; then
            echo "::error file=copier.yml::github_workflows must be \"vX.Y.Z@<40-hex sha>\""; exit 1
          fi
          ref="${pin%@*}" sha="${pin#*@}"
          # An annotated tag: the commit is the peeled ref (^{}).
          tagged="$(git ls-remote --tags https://github.com/iT3E/github-workflows.git "refs/tags/${ref}^{}" | cut -f1)"
          if [ "$tagged" != "$sha" ]; then
            echo "::error file=copier.yml::${ref} of iT3E/github-workflows is ${tagged:-missing}, not ${sha}"; exit 1
          fi
          echo "PIN_REF=$ref" >> "$GITHUB_ENV"
          echo "PIN_SHA=$sha" >> "$GITHUB_ENV"
          echo "github_workflows: ${ref} (${sha})"

      - name: This repo uses the same release
        run: |
          bad="$(grep -rhoE 'iT3E/github-workflows/\.github/workflows/[a-z-]+\.yaml@.*' .github/workflows | grep -vxE "iT3E/github-workflows/\.github/workflows/[a-z-]+\.yaml@${PIN_SHA} # ${PIN_REF}" || true)"
          if [ -n "$bad" ]; then
            echo "::error::callers in .github/workflows that aren't ${PIN_SHA} # ${PIN_REF}:"; echo "$bad"; exit 1
          fi
          bad="$(grep -oE 'github>iT3E/github-workflows//[^"]+' .github/renovate.json5 | grep -vE "#${PIN_REF}\$" || true)"
          if [ -n "$bad" ]; then
            echo "::error file=.github/renovate.json5::presets that aren't #${PIN_REF}:"; echo "$bad"; exit 1
          fi
          grep -rc "@${PIN_SHA} # ${PIN_REF}" .github/workflows | grep -v ':0$'

      # github-workflows keeps a copy for its own CI; a difference is a
      # reminder to update it there, not a reason to block this repo.
      - name: bin/privacy-check matches github-workflows' copy
        run: |
          curl -fsSL "https://raw.githubusercontent.com/iT3E/github-workflows/${PIN_SHA}/bin/privacy-check" -o "$RUNNER_TEMP/privacy-check"
          code() { sed -n '/^set -euo pipefail/,$p' "$1"; }
          if ! diff -u <(code "$RUNNER_TEMP/privacy-check") <(code template/bin/privacy-check); then
            echo "::warning::template/bin/privacy-check differs from iT3E/github-workflows' bin/privacy-check at ${PIN_REF} (below the header); keep them in step"
          fi

  actionlint:
    name: actionlint
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/actionlint.yaml@45f64446efd0d5cd93e12c13fb594a3ab32dd0d2 # v1.0.0

  render:
    name: render (${{ matrix.answers }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        answers: [go, python, go-lib]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # copier reads the tags (copier update from the newest one)
          fetch-depth: 0
          persist-credentials: false

      - name: Install copier
        run: pipx install "copier==${COPIER_VERSION}"

      # copier copies from git, so the checkout must be a clean commit; on a
      # PR that is the merge commit actions/checkout made.
      - name: Render
        env:
          ANSWERS: ${{ matrix.answers }}
        run: |
          git config --global user.name "template-ci"
          git config --global user.email "template-ci@users.noreply.github.com"
          # Absolute source, so copier update can find it again; the
          # directory name is what repo_name becomes.
          out="$RUNNER_TEMP/fresh/example-$ANSWERS"
          copier copy --defaults --data-file "tests/$ANSWERS.yml" --vcs-ref HEAD "$GITHUB_WORKSPACE" "$out"
          echo "OUT=$out" >> "$GITHUB_ENV"
          find "$out" -type f | sed "s|^$out/||" | sort

      - name: Answers and pins
        run: |
          pin="$(sed -nE '/^github_workflows:/,/^[a-z]/s/^  default: "(v[^@"]+@[0-9a-f]{40})"$/\1/p' copier.yml)"
          ref="${pin%@*}" sha="${pin#*@}"
          echo "PIN_SHA=$sha" >> "$GITHUB_ENV"
          cd "$OUT"
          grep -q '^_commit: ' .copier-answers.yml
          for q in repo_name github_workflows github_workflows_ref github_workflows_sha; do
            if grep -q "^${q}:" .copier-answers.yml; then
              echo "::error::${q} must not be stored in .copier-answers.yml"; exit 1
            fi
          done
          if grep -rn 'iT3E/app-template\|iT3E/app-repo-template/\.github' .github; then
            echo "::error::a rendered file still calls the template repo"; exit 1
          fi
          # Every caller pins copier.yml's github_workflows, and the
          # Renovate presets are that release too.
          bad="$(grep -rhoE 'uses: [^ ]+' .github/workflows | grep -vxE "uses: iT3E/github-workflows/\.github/workflows/[a-z-]+\.yaml@${sha}" || true)"
          if [ -n "$bad" ]; then
            echo "::error::callers that don't pin github-workflows ${ref} (${sha}):"; echo "$bad"; exit 1
          fi
          grep -rc "@${sha} # ${ref}\$" .github/workflows
          test "$(grep -c "github>iT3E/github-workflows//renovate/[a-z]*\.json5#${ref}\"" .github/renovate.json5)" = 2

      # Outside the workspace: copier copies from it with git, and a
      # nested repository there would look like a broken submodule.
      - name: Fetch github-workflows at the pin
        run: |
          git init -q "$RUNNER_TEMP/github-workflows"
          cd "$RUNNER_TEMP/github-workflows"
          git fetch -q --depth 1 https://github.com/iT3E/github-workflows.git "$PIN_SHA"
          git checkout -q FETCH_HEAD

      - name: actionlint (reusable workflows as local files)
        env:
          ANSWERS: ${{ matrix.answers }}
        run: |
          cp -r "$OUT" "$RUNNER_TEMP/lint-$ANSWERS"
          cd "$RUNNER_TEMP/lint-$ANSWERS"
          git init -q  # actionlint finds the project by its .git
          for f in "$RUNNER_TEMP"/github-workflows/.github/workflows/*.yaml; do
            grep -q '^  workflow_call:' "$f" || continue
            cp "$f" ".github/workflows/tpl-$(basename "$f")"
          done
          sed -i -E 's#iT3E/github-workflows/\.github/workflows/([a-z-]+\.yaml)@[0-9a-f]{40} \# .*#./.github/workflows/tpl-\1#' .github/workflows/*.yaml
          if grep -rn 'iT3E/github-workflows/' .github/workflows; then
            echo "::error::a caller wasn't swapped for its local copy"; exit 1
          fi
          docker run --rm -v "$PWD":/repo -w /repo "rhysd/actionlint:${ACTIONLINT_VERSION#v}" -color

      - name: pre-commit validate-config
        run: |
          cd "$OUT"
          pipx run "pre-commit==${PRE_COMMIT_VERSION}" validate-config .pre-commit-config.yaml

      - name: yamllint
        run: |
          pipx run "yamllint==${YAMLLINT_VERSION}" -c .yamllint.yaml \
            "$OUT/.github" "$OUT/.pre-commit-config.yaml" "$OUT/Taskfile.yml" \
            "$OUT/.changie.yaml" "$OUT/.copier-answers.yml"

      - name: shellcheck
        run: shellcheck "$OUT"/bin/*

      - name: copier update from the latest tag
        env:
          ANSWERS: ${{ matrix.answers }}
        run: |
          # The newest release this commit descends from (a newer tag on
          # main, e.g. the release a merge just cut, would be a downgrade).
          last="$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)"
          if [ -z "$last" ]; then
            echo "No tag yet; skipped"; exit 0
          fi
          old="$RUNNER_TEMP/update/example-$ANSWERS"
          copier copy --defaults --data-file "tests/$ANSWERS.yml" --vcs-ref "$last" "$GITHUB_WORKSPACE" "$old"
          cd "$old"
          git init -q && git add -A && git commit -qm "render $last"
          # The answers file again, so a question added since $last gets
          # the same answer as the fresh render (Renovate takes defaults).
          copier update --defaults --skip-answered --vcs-ref HEAD \
            --data-file "$GITHUB_WORKSPACE/tests/$ANSWERS.yml"
          if git status --porcelain | grep -E '\.rej$' || git grep -n -E '^(<<<<<<<|>>>>>>>) ' ; then
            echo "::error::copier update $last -> HEAD left conflicts"; exit 1
          fi
          # The updated repo must be what a fresh render of HEAD gives,
          # except the files created once (_skip_if_exists), which belong
          # to the repo and stay as they were.
          skip=()
          while read -r f; do skip+=(-x "$(basename "$f")"); done \
            < <(sed -n '/^_skip_if_exists:/,/^[^ ]/s/^  - //p' "$GITHUB_WORKSPACE/copier.yml")
          echo "Not compared (created once): ${skip[*]}"
          diff -r -x .git "${skip[@]}" "$OUT" "$old"
          echo "copier update $last -> $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD): clean"

  renovate:
    name: renovate-config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Render the repo configs
        run: |
          git config --global user.name "template-ci"
          git config --global user.email "template-ci@users.noreply.github.com"
          pipx install "copier==${COPIER_VERSION}"
          for a in go python; do
            copier copy --quiet --defaults --data-file "tests/$a.yml" --vcs-ref HEAD "$GITHUB_WORKSPACE" "$RUNNER_TEMP/example-$a"
          done

      - name: renovate-config-validator
        run: |
          npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict --no-global \
            .github/renovate.json5 \
            "$RUNNER_TEMP"/example-*/.github/renovate.json5
