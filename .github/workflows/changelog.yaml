---
name: "Changelog"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  changelog:
    name: changelog
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/changelog.yaml@81dd48479541d3a5ef461a03d658b1f943b2f969 # v1.2.1
