---
name: "Changelog"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  changelog:
    name: changelog
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/changelog.yaml@4628c925b741e980e4dfab955ec7e7db5dc14ef1 # v1.10.0
