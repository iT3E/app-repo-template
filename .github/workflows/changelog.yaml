---
name: "Changelog"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  changelog:
    name: changelog
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/changelog.yaml@317dd05ec8f5988a9a6f799a2119aba537b4bb16 # v1.4.2
