---
name: "Self: Release"

# This repo's own use of the reusable workflow next to it (local path, so a
# PR tests its own change).
# Releasing the template: merge a PR with a Changie fragment, and this tags
# vX.Y.Z (README "Releasing the template"). The tag is what app repos'
# .copier-answers.yml and @<sha> pins move to. No image, so nothing is
# dispatched.
on:
  push:
    branches: ["main"]
    paths: [".changes/unreleased/**"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto follows the fragment kinds)"
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/release.yaml
    with:
      bump: ${{ inputs.bump || 'auto' }}
      build-workflow: ""
