---
name: "Privacy (comments)"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  text:
    name: privacy-text
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: iT3E/github-workflows/.github/workflows/privacy-text.yaml@e05083a9e404e4e3ade5ded0c35f3d6692cd3f15 # v1.1.0
    secrets:
      PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
