---
name: "Privacy (comments)"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  text:
    name: privacy-text
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: iT3E/github-workflows/.github/workflows/privacy-text.yaml@4968e2ea41429e3b8e9b1e77f41d222a5ea01436 # v1.8.1
    secrets:
      PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
