---
name: "Privacy"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
# This repo is public; a fork PR has no PRIVACY_TERMS, so it warns
# instead of failing (privacy-text and the push to main still check).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ["main"]

permissions: {}

jobs:
  privacy:
    name: privacy
    permissions:
      contents: read
    uses: iT3E/github-workflows/.github/workflows/privacy.yaml@81dd48479541d3a5ef461a03d658b1f943b2f969 # v1.2.1
    with:
      allow-missing-terms: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
    secrets:
      PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
