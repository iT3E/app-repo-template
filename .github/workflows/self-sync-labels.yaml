---
name: "Self: Sync labels"

# This repo's own use of the reusable workflow next to it (local path, so a
# PR tests its own change).
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/labels.yaml"]

permissions: {}

jobs:
  labels:
    name: sync-labels
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/sync-labels.yaml
