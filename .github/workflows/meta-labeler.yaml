---
name: "Labeler"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  labeler:
    name: labeler
    permissions:
      contents: read
      pull-requests: write
    uses: iT3E/github-workflows/.github/workflows/labeler.yaml@e05083a9e404e4e3ade5ded0c35f3d6692cd3f15 # v1.1.0
