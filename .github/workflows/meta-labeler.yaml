---
name: "Labeler"

# This repo's own caller of the iT3E/github-workflows reusable workflow, at
# the release copier.yml pins (github_workflows; template-ci checks they
# match, and Renovate moves them together).
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  labeler:
    name: labeler
    permissions:
      contents: read
      pull-requests: write
    uses: iT3E/github-workflows/.github/workflows/labeler.yaml@39a44e0ed437699eaafe4b01afedd6063b69ee4d # v1.3.0
