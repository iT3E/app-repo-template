---
name: "Self: Labeler"

# This repo's own use of the reusable workflow next to it (local path, so a
# PR tests its own change).
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  labeler:
    name: labeler
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/labeler.yaml
