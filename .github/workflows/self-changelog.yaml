---
name: "Self: Changelog"

# This repo's own use of the reusable workflow next to it (local path, so a
# PR tests its own change).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  changelog:
    name: changelog
    permissions:
      contents: read
    uses: ./.github/workflows/changelog.yaml
