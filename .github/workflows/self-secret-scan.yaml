---
name: "Self: Secret Scan"

# This repo's own use of the reusable workflow next to it (local path, so a
# PR tests its own change).
on:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

jobs:
  betterleaks:
    name: betterleaks
    permissions:
      contents: read
    uses: ./.github/workflows/secret-scan.yaml
